# 배포용 Compose: 앱 + PostgreSQL + Caddy(자동 HTTPS). 이 폴더(deploy/)에서
#   docker compose up -d --build --wait
# 순서: postgres(healthy) → pre-migrate-backup(백업·되살리기 검사 후 종료) → migrate(`alembic upgrade head`
# 후 종료) → app(healthy) → caddy. backup 은 따로 떠 있으면서 매일 04:00(KST) 백업합니다.
# 값은 이 폴더의 .env(Git 에 안 올림 — .env.example 을 복사)에서 읽습니다. 절차·주의는 README.md.
#
# 로컬 개발용 DB 는 BACKEND/compose.yaml(프로젝트 이름 k-dpp)이고, 이 파일과 이름·볼륨이
# 겹치지 않습니다. 이 파일의 볼륨에는 실제 사용자 데이터와 HTTPS 인증서가 들어갑니다 —
# `docker compose down -v` 는 둘 다 지웁니다.
name: k-dpp-deploy

x-logging: &logging
  # 컨테이너 로그가 디스크를 채우지 않게 서비스마다 10MB × 3개까지만 둡니다.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  # migrate 와 app 은 같은 이미지를 씁니다(빌드 문맥 = 저장소 루트, BACKEND/Dockerfile).
  image: k-dpp-app:local
  build:
    context: ..
    dockerfile: BACKEND/Dockerfile
  logging: *logging

x-app-env: &app-env
  # 비밀번호는 URL 에 들어가므로 영문·숫자만 씁니다(.env.example).
  K_DPP_DATABASE_URL: postgresql+psycopg://kdpp:${POSTGRES_PASSWORD:?deploy/.env 에 POSTGRES_PASSWORD 를 넣으세요}@postgres:5432/k_dpp

x-backup: &backup
  # postgres 와 같은 이미지라 pg_dump 버전이 DB 서버와 같습니다. 스크립트는 backup/kdpp-backup.sh.
  image: postgres:18-trixie
  entrypoint: ["bash", "/opt/kdpp-backup/kdpp-backup.sh"]
  environment:
    PGHOST: postgres
    PGUSER: kdpp
    PGPASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 에 POSTGRES_PASSWORD 를 넣으세요}
    PGDATABASE: k_dpp
    TZ: Asia/Seoul
    K_DPP_BACKUP_AT: ${K_DPP_BACKUP_AT:-04:00}
    K_DPP_BACKUP_MAX_AGE_MIN: ${K_DPP_BACKUP_MAX_AGE_MIN:-1560}
  volumes:
    # 파일 하나가 아니라 폴더째 연결합니다 — git pull 로 바뀐 스크립트가 떠 있는 컨테이너에도 보이게.
    - ./backup:/opt/kdpp-backup:ro
    # 백업 파일(이메일·비밀번호 해시가 들어 있음 — 폴더 700·파일 600). Git 에 올리지 않습니다.
    - ./backups:/backups
  depends_on:
    postgres:
      condition: service_healthy
  logging: *logging

services:
  postgres:
    # BACKEND/compose.yaml 과 같은 이미지(메이저 고정, 18.x 패치는 `docker compose pull`).
    image: postgres:18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: kdpp
      # 볼륨을 처음 만들 때만 쓰입니다. 나중에 바꾸려면 README '비밀번호 바꾸기'.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env 에 POSTGRES_PASSWORD 를 넣으세요}
      POSTGRES_DB: k_dpp
    # 포트를 밖에 열지 않습니다. 앱과 migrate 만 Compose 안쪽 네트워크로 붙습니다.
    volumes:
      # PostgreSQL 18 이미지부터 볼륨 위치가 /var/lib/postgresql 입니다.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kdpp -d k_dpp"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  pre-migrate-backup:
    # ① 배포 직전 백업: `up` 할 때마다 migrate 보다 먼저 한 번 뜨고 되살려 검사합니다.
    # 실패하면 migrate·app 이 시작하지 않습니다(README '백업이 실패해 앱이 안 뜰 때').
    <<: *backup
    command: ["once", "pre-migrate"]
    restart: "no"

  backup:
    # ② 매일 백업: 매일 K_DPP_BACKUP_AT 에 백업하고 되살려 검사합니다. 매일 백업의 마지막 성공이
    # K_DPP_BACKUP_MAX_AGE_MIN(기본 26시간)보다 오래되면 unhealthy 로 보입니다(배포 직전·수동 백업은 세지 않음).
    <<: *backup
    command: ["loop"]
    init: true
    restart: unless-stopped
    depends_on:
      pre-migrate-backup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bash", "/opt/kdpp-backup/kdpp-backup.sh", "health"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 1m
      start_interval: 2s

  migrate:
    # 표·소재를 최신 리비전으로 맞추고 끝납니다. 이미 최신이면 아무것도 하지 않습니다.
    # 서버는 스키마를 바꾸지 않고 확인만 하므로(database.assert_schema_current), 이 단계가
    # 실패하면 app 은 시작하지 않습니다.
    <<: *app
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      pre-migrate-backup:
        condition: service_completed_successfully
    restart: "no"

  app:
    <<: *app
    restart: unless-stopped
    environment:
      <<: *app-env
      # Google Vision 키. 앱은 저장소 경로의 key.json 이 없으면 이 환경변수를 씁니다.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/vision_key
      # 서버 전체 하루 사진 분석(Vision) 상한. 비우면 상한이 없어지므로 배포는 필수입니다(DECISIONS 164).
      K_DPP_SCAN_DAILY_MAX: ${K_DPP_SCAN_DAILY_MAX:?deploy/.env 에 K_DPP_SCAN_DAILY_MAX 를 넣으세요}
      # /docs·/redoc·/openapi.json 을 끕니다(로컬 기본은 켬, DECISIONS 142).
      K_DPP_API_DOCS: "off"
      # 카카오 로그인용 카카오 앱 ID(숫자, 비밀값 아님 — DECISIONS 152 ⑦). 비우면 카카오 로그인이 꺼져 503.
      K_DPP_KAKAO_APP_ID: ${K_DPP_KAKAO_APP_ID:-}
    secrets:
      - vision_key
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # 포트를 밖에 열지 않습니다. Caddy 만 app:8000 으로 넘깁니다.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s

  caddy:
    # 메이저 고정(2.x 패치는 `docker compose pull`).
    image: caddy:2
    restart: unless-stopped
    environment:
      K_DPP_DOMAIN: ${K_DPP_DOMAIN:?deploy/.env 에 K_DPP_DOMAIN 을 넣으세요}
    ports:
      # 서버에서는 기본값(모든 주소의 80·443) 그대로 둡니다. 맥 리허설만 .env 에서 바꿉니다.
      - "${K_DPP_LISTEN_ADDR:-0.0.0.0}:${K_DPP_HTTP_PORT:-80}:80"
      - "${K_DPP_LISTEN_ADDR:-0.0.0.0}:${K_DPP_HTTPS_PORT:-443}:443"
      - "${K_DPP_LISTEN_ADDR:-0.0.0.0}:${K_DPP_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서·계정 키. 지우면 다시 발급받아야 하고, 짧은 시간에 여러 번
      # 지우면 Let's Encrypt 발급 한도에 걸립니다.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

secrets:
  vision_key:
    # 파일이 있어야 시작합니다. 키 없이 띄우는 법은 README 'Vision 키'.
    file: ${K_DPP_VISION_KEY_FILE:-./secrets/vision_key.json}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
