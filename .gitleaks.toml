title = "K-DPP secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

# A service-account document is prohibited even before its private key is populated.
[[rules]]
id = "kdpp-service-account-document"
description = "Google service-account document"
regex = '''"type"\s*:\s*"service_account"'''
keywords = ["service_account"]

[[rules]]
id = "kdpp-private-key-marker"
description = "Private-key header, including incomplete pasted keys"
regex = '''-----BEGIN (?:[A-Z0-9]+ )*PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["private key"]
