name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner
        run: python3 scripts/security/setup.py --download-only
      - name: Test blocking and redaction
        run: python3 -m unittest discover -s scripts/security/tests -v
      - name: Scan complete reachable history and current tree
        env:
          SCAN_REF: ${{ github.ref_type == 'tag' && github.ref || 'HEAD' }}
        run: python3 scripts/security/check_secrets.py history --ref "$SCAN_REF"
