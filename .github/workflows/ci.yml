# push·PR마다 프론트엔드 분석·테스트를 자동 실행해 회귀를 조기에 잡습니다.
# 백엔드 잡은 폴더가 있는 브랜치에서만 참고용으로 실행합니다(파트 확인 후 필수 전환).
name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # BACKEND는 모노레포에 항상 있어야 합니다. 없으면 스킵이 통과로 보이지 않도록
      # 여기서 바로 실패시킵니다.
      - name: Check backend folder
        run: test -d BACKEND

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: BACKEND
        run: pip install -r requirements.txt

      - name: Test
        working-directory: BACKEND
        run: pytest
