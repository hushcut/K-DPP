name: AI and backend checks

on:
  push:
    paths:
      - "AI/kdpp_ai_ocr_integrated/**"
      - "BACKEND/**"
      - "QA/**"
      - ".github/workflows/ai-checks.yml"
  pull_request:
    paths:
      - "AI/kdpp_ai_ocr_integrated/**"
      - "BACKEND/**"
      - "QA/**"
      - ".github/workflows/ai-checks.yml"

jobs:
  test:
    name: OCR parser and backend wiring tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI/kdpp_ai_ocr_integrated
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install multilingual synthetic font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependency lock tool
        run: python -m pip install uv==0.12.18

      - name: Verify dependency locks
        run: |
          uv --quiet pip compile requirements.txt --universal --python-version 3.12 --constraint requirements-text.lock --no-header --no-annotate -o "$RUNNER_TEMP/requirements-text.lock"
          diff -u requirements-text.lock "$RUNNER_TEMP/requirements-text.lock"
          uv --quiet pip compile requirements-symbol.txt --universal --python-version 3.12 --constraint requirements-symbol.lock --no-header --no-annotate -o "$RUNNER_TEMP/requirements-symbol.lock"
          diff -u requirements-symbol.lock "$RUNNER_TEMP/requirements-symbol.lock"
          uv --quiet pip compile requirements-dev.txt ../../BACKEND/requirements.txt --universal --python-version 3.12 --constraint requirements-ci.lock --no-header --no-annotate -o "$RUNNER_TEMP/requirements-ci.lock"
          diff -u requirements-ci.lock "$RUNNER_TEMP/requirements-ci.lock"

      - name: Install AI and backend test dependencies
        run: python -m pip install -r requirements-ci.lock

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q
