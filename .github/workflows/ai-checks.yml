name: AI and backend checks

on:
  push:
    paths:
      - "AI/kdpp_ai_ocr_integrated/**"
      - "BACKEND/**"
      - "QA/**"
      - ".github/workflows/ai-checks.yml"
  pull_request:
    paths:
      - "AI/kdpp_ai_ocr_integrated/**"
      - "BACKEND/**"
      - "QA/**"
      - ".github/workflows/ai-checks.yml"

jobs:
  test:
    name: OCR parser and backend wiring tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI/kdpp_ai_ocr_integrated
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install multilingual synthetic font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install AI and backend test dependencies
        run: python -m pip install -r requirements-dev.txt -r ../../BACKEND/requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q
