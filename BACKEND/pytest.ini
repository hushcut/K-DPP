[pytest]
# tests/conftest.py가 BACKEND의 database·main을 직접 import하므로 BACKEND를
# import 경로에 넣는다.
#
# `python -m pytest`는 현재 디렉터리를 sys.path에 넣어 주기 때문에 로컬에서는
# 이 설정 없이도 통과했지만, CI는 `pytest`로 실행해 그 경로가 없어
# ModuleNotFoundError: No module named 'database' 로 수집 단계에서 죽었다.
# (백엔드 잡이 continue-on-error였던 동안에는 이 실패가 초록으로 가려져 있었다)
pythonpath = .
testpaths = tests
